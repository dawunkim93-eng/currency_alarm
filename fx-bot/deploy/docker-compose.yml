# 상주 실행 (도커)
#
#   cp fx-bot/deploy/fx-bot.env.example fx-bot/deploy/fx-bot.env   # 토큰 채우기
#   cp fx-bot/config.example.json fx-bot/config.json               # 우대율·임계값
#   docker compose -f fx-bot/deploy/docker-compose.yml up -d
#   docker compose -f fx-bot/deploy/docker-compose.yml logs -f
#
# 빌드 컨텍스트가 저장소 루트라는 점에 주의 (Dockerfile 이 fx-bot/ 을 통째로 복사한다).

# 프로젝트 이름을 고정한다. 안 그러면 디렉터리 이름을 따라 "deploy_..." 로
# 볼륨이 만들어져서, 나중에 어느 볼륨이 봇 상태인지 알아보기 어렵다.
name: fx-bot

services:
  fx-bot:
    build:
      context: ../..
      dockerfile: fx-bot/deploy/Dockerfile
    container_name: fx-bot
    restart: unless-stopped
    env_file: fx-bot.env
    volumes:
      # 상태(쿨다운·시세 기록)는 컨테이너를 다시 만들어도 살아남아야 한다.
      - fx-bot-state:/state
      # 설정은 호스트 파일을 그대로 읽는다. 고치고 restart 하면 반영된다.
      - ../config.json:/app/fx-bot/config.json:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  fx-bot-state:
